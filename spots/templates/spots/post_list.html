{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>投稿一覧 - アニメ聖地巡礼</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    {% include 'spots/sidebar.html' %}

    <div id="main-content" class="main-content">
        <h1>聖地巡礼投稿一覧</h1>

        {% for spot in object_list %}
        <div class="spot">
            <div class="spot-image-container">
                {% if spot.image %}
                    <img src="{{ spot.image.url }}" alt="{{ spot.name }}">
                {% else %}
                    <div style="height: 150px; background: #333; border-radius: 8px; display: flex; align-items: center; justify-content: center;">No Image</div>
                {% endif %}
            </div>

            <div class="spot-info-container">
                <h2><a href="{% url 'spots:detail' spot.pk %}">{{ spot.name }}</a></h2>
                <p>📍 場所：{{ spot.location }}</p>
                <p>{{ spot.description|truncatechars:100 }}</p>
            </div>
        </div>
        {% empty %}
        <div class="form-container" style="text-align: center;">
            <p>聖地がまだ登録されていません。</p>
            <a href="{% url 'post_create' %}" class="btn" style="margin-top: 15px;">最初の投稿をする</a>
        </div>
        {% endfor %}
    </div>

    <script>
        const sidebarWidth = "250px";

        function openNav() {
            document.getElementById("mySidebar").style.width = sidebarWidth;
            document.getElementById("main-content").style.marginLeft = sidebarWidth;
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("main-content").style.marginLeft = "0";
        }
    </script>
</body>
</html>
