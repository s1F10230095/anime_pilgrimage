<button class="openbtn" onclick="openNav()">☰ メニュー</button>

<div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" onclick="closeNav()">✖ 閉じる</a>
    <a href="{% url 'home' %}">ホーム</a>
    <a href="{% url 'spot_list' %}">聖地一覧</a>
    <a href="{% url 'map' %}">マップ</a>
    <a href="{% url 'post_list' %}">投稿一覧</a>
    <a href="{% url 'post_create' %}">投稿する</a>
    <a href="#">問い合わせ</a>

    <hr style="border-color: #555;"> {% if user.is_authenticated %}
        <div class="user-info" style="padding-left: 32px; color: #f1f1f1;">
            <p style="margin: 10px 0;">👤 {{ user.username }}</p>
            
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" style="
                    color: #ff4444; 
                    background: none; 
                    border: none; 
                    cursor: pointer; 
                    font-size: 20px; 
                    text-align: left;
                    padding: 0;">
                    ログアウト
                </button>
            </form>
        </div>
    {% else %}
        <a href="{% url 'login' %}">ログイン</a>
    {% endif %}
    </div>
