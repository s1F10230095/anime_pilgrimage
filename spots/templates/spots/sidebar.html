<button class="openbtn" onclick="openNav()">☰ メニュー</button>
<div id="mySidebar" class="sidebar">
    <a href="javascript:void(0)" onclick="closeNav()">✖ 閉じる</a>
    <a href="{% url 'home' %}">ホーム</a>
    <a href="{% url 'spot_list' %}">聖地一覧</a>
    <a href="{% url 'map' %}">マップ</a>
    <a href="{% url 'post_list' %}">投稿一覧</a>
    <a href="{% url 'post_create' %}">投稿する</a>
    <a href="{% url 'ai_travel' %}">AI旅行プラン</a>
    <a href="#">問い合わせ</a>
    <hr style="border-color: #333; margin: 10px 0;">
    {% if user.is_authenticated %}
        <div style="padding: 10px 32px; color: #f1f1f1;">
            <p>👤 {{ user.username }}</p>
            <a href="{% url 'profile_detail' %}" style="padding: 10px 0; font-size: 16px;">プロフィール</a>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" style="color: #ff4444; background: none; border: none; padding: 0; font-size: 16px;">ログアウト</button>
            </form>
        </div>
    {% else %}
        <a href="{% url 'login' %}">ログイン</a>
        <a href="{% url 'signup' %}">新規登録</a>
    {% endif %}
</div>
