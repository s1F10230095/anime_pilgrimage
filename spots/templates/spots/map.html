{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アニメ聖地マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* 念のための追加スタイル */
        body { margin: 0; }
        
        .main-content {
            margin-left: 0;
            padding-top: 60px;
            transition: margin-left 0.3s;
            min-height: 100vh;
        }

        .popup-img {
            width: 150px;
            height: auto;
            display: block;
            margin-bottom: 5px;
            border-radius: 4px;
        }
        
        .user-menu-container {
            position: fixed;
            top: 10px;
            right: 20px;
            z-index: 2000;
        }
        .user-menu-btn {
            background: #333;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid #555;
        }
        .user-menu {
            display: none;
            position: absolute;
            right: 0;
            background: #222;
            color: #fff;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-top: 8px;
            width: 180px;
            border: 1px solid #444;
        }
        .user-menu a, .user-menu button {
            display: block;
            padding: 10px;
            text-align: left;
            width: 100%;
            background: none;
            border: none;
            cursor: pointer;
            color: #fff;
            text-decoration: none;
        }
        .user-menu a:hover, .user-menu button:hover {
            background: #333;
        }
    </style>

    <script>
        function toggleUserMenu() {
            const menu = document.getElementById("userMenu");
            menu.style.display = (menu.style.display === "block") ? "none" : "block";
        }
    </script>
</head>

<body>

    {% include 'spots/sidebar.html' %}

    <div class="user-menu-container">
        <button class="user-menu-btn" onclick="toggleUserMenu()">
            {% if user.is_authenticated %}
                👤 {{ user.username }}
            {% else %}
                ログイン
            {% endif %}
        </button>
        <div id="userMenu" class="user-menu">
            {% if user.is_authenticated %}
                {% if profile and profile.icon %}
                    <div style="text-align:center; padding:10px;">
                        <img src="{{ profile.icon.url }}" alt="icon" style="width:60px; height:60px; border-radius:50%; object-fit: cover;">
                    </div>
                {% endif %}
                <a href="{% url 'profile_edit' %}">プロフィール編集</a>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" style="color: #ff4444;">ログアウト</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">ログイン</a>
                <a href="{% url 'signup' %}">新規登録</a>
            {% endif %}
        </div>
    </div>

    <div id="main-content" class="main-content">
        <h1>アニメ聖地マップ</h1>
        
        <div id="map" style="height: 600px; width: 100%; border-radius: 10px; border: 2px solid #333; z-index: 1;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ======== サイドバー開閉処理 ========
        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
            document.getElementById("main-content").style.marginLeft = "250px";
            setTimeout(() => { if(map) map.invalidateSize(); }, 350);
        }
