<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>アニメ聖地マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map { height: 600px; }
    .popup-img {
        width: 150px;
        height: auto;
        display: block;
        margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <h1>アニメ聖地マップ</h1>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([35.681236, 139.767125], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    {% for spot in spots %}
      (function() {
        const popupContent = `
          <img src="{{ spot.image_url|safe }}" alt="画像" class="popup-img">
          <strong>{{ spot.title|safe }}</strong><br>
          {{ spot.location|safe }}<br>
          {{ spot.description|safe }}
      `  ;
        L.marker([{{ spot.latitude }}, {{ spot.longitude }}]).addTo(map)
          .bindPopup(popupContent);
      })();
  {% endfor %}
  </script>
</body>
</html>
