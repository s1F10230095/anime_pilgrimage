<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>アニメ聖地巡礼 - 聖地一覧</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }
        /* サイドバー */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #333;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            z-index: 1000;
        }
        .sidebar a {
            padding: 10px 20px;
            text-decoration: none;
            font-size: 18px;
            color: white;
            display: block;
            transition: 0.2s;
        }
        .sidebar a:hover {
            background-color: #575757;
        }

        /* メニューを開くボタン */
        .openbtn {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: 20px;
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 1100;
        }
        .openbtn:hover {
            background-color: #444;
        }

        /* メインコンテンツ */
        .main-content {
            margin-left: 20px;
            padding-top: 50px;
            transition: margin-left 0.3s;
        }
        .spot {
            margin-bottom: 30px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
        }
        .spot img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- メニューを開くボタン -->
    <button class="openbtn" onclick="openNav()">☰ メニュー</button>

    <!-- サイドバー -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" onclick="closeNav()">✖ 閉じる</a>
        <a href="{% url 'home' %}">ホーム</a>
        <a href="{% url 'spot_list' %}">聖地一覧</a>
        <a href="{% url 'map' %}">マップ</a>
        <a href="#">お問い合わせ</a>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content">
        <h1>アニメ聖地巡礼</h1>
        {% for spot in spots %}
            <div class="spot">
                <h2><a href="{% url 'spot_detail' spot.pk %}">{{ spot.title }}</a></h2>
                <p>{{ spot.location }}</p>
                {% if spot.image_url %}
                    <img src="{{ spot.image_url }}" alt="{{ spot.title }}">
                {% else %}
                    <p>画像はありません</p>
                {% endif %}
            </div>
        {% empty %}
            <p>登録された聖地はありません。</p>
        {% endfor %}
    </div>

    <script>
        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }
    </script>
</body>
</html>
